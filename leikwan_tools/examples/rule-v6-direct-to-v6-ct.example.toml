# 示例规则 3：本机公网 IPv6 直连入口 -> 电信 IPv6 出口 -> IPv6 落地（仅作示例，安装时不启用）
# 链路示例：客户端直连 [240e:3b4:1::10]:54202 -> Realm (through=[240e:3b4:1::10], interface=eth0) -> [2001:db8:99::10]:54141
# 说明：需先在 config.toml 中启用 [lines.ct_v6]，并将 listen_ip / remote_ip 替换为实际地址。

[rule]
name = "v6-direct-to-v6-ct"
description = "组合2示例：本机公网 IPv6 直连入口经电信 IPv6 出口连接 IPv6 落地"
line = "ct_v6"

[ingress]
domain = ""
fixed_ip = ""
public_port = 54202

[forward]
listen_ip = "240e:3b4:1::10"
listen_port = 54202
remote_ip = "2001:db8:99::10"
remote_port = 54141

[realm]
log_level = "warn"
tcp_timeout = 5
tcp_keepalive = 15
tcp_keepalive_probe = 3
