# 独立「leikwan_tools」主配置示例 (/etc/leikwan_tools/config.toml)
# 说明：以下地址、网卡、网关与路由表号仅作示例，实际部署时请核对本机 `ip addr` 与 `ip rule` 输出后修改。

[tool]
# 留空时自动优先发现已安装的兼容 Realm (>= 2.6.0, 主版本 2)；也可显式指定路径
realm_bin = ""
rules_dir = "/etc/leikwan_tools/rules.d"
state_dir = "/var/lib/leikwan_tools"
# 受管 systemd 模板单元名必须固定为 leikwan_tools-realm@.service
systemd_unit_template = "leikwan_tools-realm@.service"
lock_file = "/run/leikwan_tools.lock"
# 开机启动时 systemd ExecStartPre 等待源策略路由就绪的最大秒数
startup_route_wait_seconds = 45

[ingress]
default_domain = "paid-v4.bgp1.leikwanhost.com"
listen_interface = "eth0"
# 留空时使用 /etc/resolv.conf 与系统解析器；也可显式指定 DNS 服务器 IPv4
dns_server = ""

# 出口线路定义：网卡、源 IPv4、下一跳网关与源策略路由表号均可配置
[lines.9929]
interface = "eth0"
source_ip = "10.7.0.146"
gateway = "10.7.0.1"
table = 101
description = "CUII 9929 出口线路"

[lines.cn2]
interface = "eth1"
source_ip = "10.8.0.146"
gateway = "10.8.0.1"
table = 102
description = "CN2 GIA 出口线路"

# ----------------------------------------------------------------------
# 独立双线路 IPv6 DDNS（可选；默认未启用，与 [ingress] 和转发规则完全解耦）
# 说明：第一版仅支持 IPv6 AAAA 记录（配置模型已预留 A 记录扩展）；
#       明文 Token/Secret 请存放在 chmod 600 的独立凭据文件中，切勿写入主配置。
# ----------------------------------------------------------------------
# [ddns]
# enabled = true
# interval_seconds = 120
# verify_interval_seconds = 600
# probe_target = "2400:3200::1"
# probe_timeout_seconds = 1
#
# [ddns.ct]
# enabled = true
# isp = "ct"
# interface = "eth0"
# provider = "cloudflare"        # cloudflare | dnspod | alidns | webhook
# record_type = "AAAA"
# zone = "example.com"
# host = "ct"
# credential_file = "/etc/leikwan_tools/secrets/ddns-ct.env"
#
# [ddns.cu]
# enabled = true
# isp = "cu"
# interface = "eth1"
# provider = "cloudflare"
# record_type = "AAAA"
# zone = "example.com"
# host = "cu"
# credential_file = "/etc/leikwan_tools/secrets/ddns-cu.env"
