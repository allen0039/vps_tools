name: VPS Toolbox Checks
on:
  push:
    paths: ["vpstools.sh", "install.sh", "tests/**", "web_tool/**", "iperf3_tool/**", "Fail2ban/**", "system_tool/**", "tcp-tool/**", "ssh-key/**", "ssh-password/**", ".github/workflows/toolbox.yml"]
  pull_request:
    paths: ["vpstools.sh", "install.sh", "tests/**", "web_tool/**", "iperf3_tool/**", "Fail2ban/**", "system_tool/**", "tcp-tool/**", "ssh-key/**", "ssh-password/**", ".github/workflows/toolbox.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n install.sh && bash -n vpstools.sh && bash -n Fail2ban/install.sh && bash -n web_tool/install.sh && bash -n iperf3_tool/iperf3-tool.sh && bash -n system_tool/install.sh && bash -n tcp-tool/install.sh && bash -n ssh-key/install.sh && bash -n ssh-password/install.sh
      - name: Check toolbox routing and installation
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check Fail2ban configuration and firewall compatibility
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fail2ban python3-systemd openssh-server
          sudo mkdir -p /run/sshd
          python3 -m unittest discover -s Fail2ban/tests -p 'test_*.py'
          python3 -m unittest discover -s safe-ssh-port/tests -p 'test_*.py'
      - name: Check SSH authentication tools and recovery
        run: |
          python3 -m unittest discover -s ssh-key/tests -p 'test_*.py'
          python3 -m unittest discover -s ssh-password/tests -p 'test_*.py'
      - name: Check network probes against local services
        run: python3 -m unittest discover -s web_tool/tests -p 'test_*.py'
      - name: Check IPv6 management and recovery
        run: python3 -m unittest discover -s system_tool/tests -p 'test_*.py' -v
      - name: Check TCP parameter import and recovery
        run: python3 -m unittest discover -s tcp-tool/tests -p 'test_*.py' -v
      - name: Install iperf3 for bounded loopback tests
        run: |
          echo 'iperf3 iperf3/start_daemon boolean false' | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y iperf3
      - name: Check iperf3 results and process cleanup
        run: python3 -m unittest discover -s iperf3_tool/tests -p 'test_*.py' -v
